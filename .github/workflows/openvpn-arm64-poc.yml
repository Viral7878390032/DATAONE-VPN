name: OpenVPN Android ARM64 Proof of Concept

on:
  push:
    branches: [ "openvpn-arm64-poc" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-arm64:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout DATAONE VPN
        uses: actions/checkout@v4

      - name: Checkout OpenVPN Rust wrapper
        uses: actions/checkout@v4
        with:
          repository: networks-rs/openvpn-connect-rs
          ref: main
          path: openvpn-rs
          submodules: recursive

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          targets: aarch64-linux-android

      - name: Locate Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "Android SDK directory not found: $SDK_ROOT"
            exit 1
          fi
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -u+x -print -quit 2>/dev/null || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT"
            find "$SDK_ROOT" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "Using SDK manager: $SDKMANAGER"

      - name: Install Android NDK and native build tools
        run: |
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "ndk;27.2.12479018"
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang libclang-dev lz4

      - name: Configure Android NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_PLATFORM=android-24" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build OpenVPN 3 Core for Android ARM64
        working-directory: openvpn-rs
        run: cargo ndk -t arm64-v8a -p 24 build --release -p openvpn-connect --features vendor

      - name: Confirm ARM64 library was built
        run: |
          test -f openvpn-rs/target/aarch64-linux-android/release/libopenvpn_connect.rlib
          file openvpn-rs/target/aarch64-linux-android/release/libopenvpn_connect.rlib
