name: OpenVPN Android ARM64 Proof of Concept

on:
  push:
    branches: [ "openvpn-arm64-poc" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-arm64:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout DATAONE VPN
        uses: actions/checkout@v4

      - name: Checkout OpenVPN Rust wrapper
        uses: actions/checkout@v4
        with:
          repository: networks-rs/openvpn-connect-rs
          ref: main
          path: openvpn-rs
          submodules: recursive

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          targets: aarch64-linux-android

      - name: Locate Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "Android SDK directory not found: $SDK_ROOT"
            exit 1
          fi
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -u+x -print -quit 2>/dev/null || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT"
            find "$SDK_ROOT" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "Using SDK manager: $SDKMANAGER"

      - name: Install Android NDK and native build tools
        run: |
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "ndk;27.2.12479018"
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang libclang-dev lz4

      - name: Configure Android NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_PLATFORM=android-24" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build OpenVPN JNI library for Android ARM64
        run: |
          cd native/openvpn-android-bridge
          cargo ndk -t arm64-v8a --platform 24 build --release
          cd ../..
          mkdir -p app/src/main/jniLibs/arm64-v8a
          install -m 0644 native/openvpn-android-bridge/target/aarch64-linux-android/release/libdataone_openvpn.so app/src/main/jniLibs/arm64-v8a/libdataone_openvpn.so
          file app/src/main/jniLibs/arm64-v8a/libdataone_openvpn.so

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"

      - name: Build Android APK with OpenVPN native library
        run: gradle assembleDebug

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: DATAONE-VPN-openvpn-arm64-poc
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
